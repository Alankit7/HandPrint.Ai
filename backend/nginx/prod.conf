# ═══════════════════════════════════════════════════════════════════════════════
# Handprint AI — nginx production reverse proxy
# ═══════════════════════════════════════════════════════════════════════════════
# Features:
#   - TLS termination (HTTP/2)
#   - Rate limiting (per-IP, differentiated by endpoint type)
#   - Request body size limits (50 MB for PDF uploads)
#   - Security headers
#   - Gzip compression
#   - Health check passthrough (no rate limit)
#   - Long timeouts for conversion jobs
#   - HTTP → HTTPS redirect
# ═══════════════════════════════════════════════════════════════════════════════

# ── Rate limiting zones ───────────────────────────────────────────────────────
# General API: 10 req/s per IP, allow burst of 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upload endpoints (POST /profiles, POST /convert): 2 req/s, burst of 5
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

# Download endpoints (GET /download/): 5 req/s, burst of 10
limit_req_zone $binary_remote_addr zone=download_limit:10m rate=5r/s;

# Connection limiting (max 20 concurrent connections per IP)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Upstream (backend FastAPI) ─────────────────────────────────────────────────
upstream handprint_backend {
    server backend:8000;
    keepalive 32;
}

# ── Main server (HTTPS) ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── TLS ────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Request body size (50 MB for PDF + image uploads) ───────────────────────
    client_max_body_size 50m;

    # ── Connection limiting ────────────────────────────────────────────────────
    limit_conn conn_limit 20;

    # ── Security headers ──────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ── Default proxy settings ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    # ── Health check (no rate limit, no access log) ──────────────────────────────
    location = /health {
        proxy_pass http://handprint_backend;
        access_log off;
    }

    # ── Upload endpoints (strict rate limit) ────────────────────────────────────
    location = /profiles {
        limit_req zone=upload_limit burst=5 nodelay;
        proxy_pass http://handprint_backend;
    }

    location /convert {
        limit_req zone=upload_limit burst=5 nodelay;
        proxy_pass http://handprint_backend;
    }

    # ── Download endpoint (moderate rate limit) ──────────────────────────────────
    location /download/ {
        limit_req zone=download_limit burst=10 nodelay;
        proxy_pass http://handprint_backend;
    }

    # ── All other endpoints (general rate limit) ────────────────────────────────
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://handprint_backend;
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Health check over HTTP (for Docker / load balancer health probes)
    location = /health {
        proxy_pass http://handprint_backend;
        access_log off;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
