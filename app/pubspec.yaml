name: handprint_ai
description: Convert printed PDFs into personalised handwriting using AI.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.3+1

  # Navigation
  go_router: ^14.1.4

  # File picking
  file_picker: ^8.0.3

  # PDF viewer (result screen)
  syncfusion_flutter_pdfviewer: ^25.1.41

  # Misc UI
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  gap: ^3.0.1
  intl: ^0.19.0

  # File system paths
  path_provider: ^2.1.3

  # Env / config
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
