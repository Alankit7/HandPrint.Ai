name: handprint_ai
description: Convert printed PDFs into personalised handwriting using AI.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client
  dio: ^5.4.3+1

  # Navigation
  go_router: ^14.1.4

  # File picking
  file_picker: ^8.0.3

  # PDF viewer (result screen)
  syncfusion_flutter_pdfviewer: ^25.1.41

  # File system paths
  path_provider: ^2.1.3

  # Settings persistence
  shared_preferences: ^2.2.3

  # Share sheet
  share_plus: ^9.0.0

  # Progress UI
  percent_indicator: ^4.2.3

  # Spacing helper
  gap: ^3.0.1

  # Env loading
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
