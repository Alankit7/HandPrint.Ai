version: "3.9"

# ── Handprint AI — local development ──────────────────────────────────────────
# Usage:
#   cp .env.example .env     # fill in API_KEY
#   docker compose up --build
#
# GPU passthrough requires the NVIDIA Container Toolkit installed on the host.
# For production use docker-compose.prod.yml instead.

services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_FORMAT: text
      LOG_LEVEL: DEBUG
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/mnt/data
      - ./backend/checkpoints:/mnt/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Flutter web (optional — production build served by nginx) ─────────────────
  flutter_web:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      API_BASE_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
